[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voro-tree-standard-qa"
version = "0.1.0"
description = "Checks tree inventory data (GeoPackage) against a client's standard; first rule pack: City of Warsaw Standard 688/2025."
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Marcin Ruszczak (MR73BIIO)" }]
requires-python = ">=3.10"
dependencies = ["geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0", "pyproj>=3.6"]
keywords = ["gis", "qgis", "trees", "tree-inventory", "data-quality", "geopackage"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
vtsqa = "vtsqa.__main__:main"

[project.urls]
Repository = "https://github.com/MR73BIIO/voro-tree-standard-qa"
Homepage = "https://mr73biio.github.io/voro-tree-standard-qa/"

[tool.setuptools]
packages = ["vtsqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
